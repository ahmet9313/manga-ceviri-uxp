<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>/* Önizleme: UXP'deki Spectrum yazı tipine yakın */ body { font-family: "Segoe UI", Arial, sans-serif; } select, input, textarea { background: #1b1c1f; color: #ececee; border: 1px solid #4a4f57; border-radius: 4px; padding: 4px 6px; }</style>
</head>
<body>
<script>
// Tasarım önizlemesi: eklenti arayüzünü Photoshop olmadan, sahte photoshop/uxp modülleriyle çizer.
// Kullanım: msedge --headless --allow-file-access-from-files --screenshot preview.html?w=360&tab=items&sel=2
const ROOT = "../../";
window.__MCS_PREVIEW = true; // önizlemede saniyelik belge kontrolü kapalı
const params = new URLSearchParams(location.search);
function load(p) { const x = new XMLHttpRequest(); x.open("GET", p, false); x.send(); return x.responseText; }
// index.html gövdesini al
const html = load(ROOT + "index.html");
document.body.insertAdjacentHTML("afterbegin", html.slice(html.indexOf("<body>") + 6, html.indexOf("<script")));

const doc = { id: 1, title: "turning-into-a-tentacle-monster-p1.psd", width: 800, height: 10000, resolution: 72, layers: [], activeLayers: [], historyStates: [] };
const fonts = ["ArialMT|Arial", "Arial-BoldMT|Arial Bold", "Impact|Impact", "TimesNewRomanPSMT|Times New Roman", "ComicSansMS-Bold|Comic Sans MS Bold", "Georgia-Bold|Georgia Bold"].map((s) => { const [ps, n] = s.split("|"); return { postScriptName: ps, name: n, family: n.split(" ")[0], style: "Regular" }; });
const mocks = {
  photoshop: {
    app: { documents: [doc], activeDocument: doc, fonts, actionTree: [{ name: "Varsayılan Eylemler", actions: [{ name: "Ahşap Çerçeve" }, { name: "Gölge" }] }], version: "27.11.0" },
    core: { executeAsModal: async (fn) => fn({ hostControl: { suspendHistory: async () => 1, resumeHistory: async () => {} } }) },
    action: { batchPlay: async () => [{}], addNotificationListener() {} },
    constants: { ElementPlacement: {}, Justification: {}, AnchorPosition: {} }, imaging: {},
  },
  uxp: {
    entrypoints: { setup() {} }, versions: {},
    storage: { localFileSystem: { getDataFolder: async () => { throw new Error("yok"); } }, secureStorage: { getItem: async () => "x", setItem: async () => {} }, formats: { utf8: "utf8" } },
  },
};
const cache = {};
function norm(p) { const out = []; for (const s of p.split("/")) { if (!s || s === ".") continue; if (s === "..") out.pop(); else out.push(s); } return out.join("/"); }
function makeRequire(from) {
  return function (name) {
    if (mocks[name]) return mocks[name];
    let p = norm(from.split("/").slice(0, -1).join("/") + "/" + name);
    if (!p.endsWith(".js")) p += ".js";
    if (cache[p]) return cache[p].exports;
    const m = { exports: {} }; cache[p] = m;
    new Function("module", "exports", "require", load(ROOT + p))(m, m.exports, makeRequire(p));
    return m.exports;
  };
}
// Panel genişliği
document.body.style.width = (params.get("w") || 360) + "px";
document.documentElement.style.background = "#111";
makeRequire("index.js")("./index.js");

// Sahte öğeler (test sayfası)
setTimeout(() => {
  const A = window.MCS;
  A.client.onCredits(128.42);
  const s = A.store.session(1);
  const mk = (o, i) => Object.assign({ id: "i" + i, order: i + 1, typeConfirmed: true, tone: "normal", direction: "left_to_right", confidence: 0.97, sourceLang: "en",
    bounds: { left: 0, top: 0, right: 100, bottom: 50 }, box: { cx: 50, cy: 25, w: 100, h: 50 }, polygon: [], lines: [], ocr: { fontsize: 28 },
    locks: { text: false, style: false, position: false }, manual: {}, status: { detected: true, translated: true, cleaned: true, typeset: true }, layerId: 10 + i,
    lastApplied: { boxW: 225, boxH: 177, angle: 0, scalePct: 100, bounds: { left: 470, top: 870, right: 700, bottom: 1020 } } }, o);
  s.state.items = [
    { source: "XIAOFEI, I'M HEADING OUT FIRST. HURRY UP, OKAY?", translation: "Xiaofei, ben önden çıkıyorum. Acele et, tamam mı?", type: "dialog" },
    { source: "OKAY.", translation: "Tamam.", type: "dialog" },
    { source: "WHAT ARE YOU DOING?! IF I GET CAUGHT, I'M DEAD!", translation: "NE YAPIYORSUN?! YAKALANIRSAM ÖLDÜM!", type: "narration", tone: "shout" },
    { source: "SUCH AN EASY-TO-UNDERSTAND LOOK...", translation: "Ne kadar da belli eden bir ifade…", type: "dialog", tone: "whisper", overflow: true },
    { source: "BUT YOU'RE PRESSING EVEN CLOSER!", translation: "AMA DAHA DA YAKLAŞIYORSUN!", type: "dialog", tone: "shout", locks: { text: true, style: false, position: false } },
    { source: "SNAP.", translation: "ÇAT!", type: "sfx", typeConfirmed: false, status: { translated: true, cleaned: false, typeset: false }, layerId: null },
    { source: "HUH HUH?", translation: "", type: "offbubble", status: { translated: false, cleaned: false, typeset: false }, layerId: null },
  ].map(mk);
  A.store.selected = new Set(params.get("sel") ? ["i" + params.get("sel")] : []);
  A.layout();
  if (params.get("view")) A.setView(params.get("view"));
  A.store.emit("change", {});
  A.notify("Dizgi tamam: 5 katman. 1 öğe minimum puntoda bile taşıyor.", "warn");
  if (params.get("tab") && params.get("tab") !== "items") A.showTab(params.get("tab"));
  if (params.get("drag")) {
    // Ayırıcıyı tut ve sağa çek (bırakma yok → kılavuz görünür); drag=commit ise bırak
    const sp = document.getElementById("splitter"), r = sp.getBoundingClientRect();
    const x = r.left + 7, y = r.top + 50;
    sp.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, clientX: x, clientY: y, button: 0, pointerId: 1 }));
    for (let k = 1; k <= 10; k++) document.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: x + k * 9, clientY: y, pointerId: 1 }));
    if (params.get("drag") === "commit") setTimeout(() => document.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, clientX: x + 90, clientY: y, pointerId: 1 })), 100);
  }
  if (params.get("busy")) { A.onBusy(true, "Tam İşlem"); A.progress("Torii yanıtı bekleniyor — Görsel çeviri", 0); A.busyInfo.t0 -= 13000; }
  if (params.get("open")) { for (const k of params.get("open").split(",")) A.cardState[k] = true; A.editor.render(); }
}, 300);
</script>
</body>
</html>
